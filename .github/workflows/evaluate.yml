name: Verify submitted benchmark fixture
on:
  workflow_dispatch:
    inputs:
      fixture:
        description: 'Approved fixture folder under fixtures/ (no arbitrary path)'
        type: choice
        options: [smoke]
        required: true
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify fixture with fixed tests
        run: python3 scripts/evaluation_runner.py --workspace fixtures/smoke --candidate fixture-smoke --task smoke --command 'python3 -m unittest discover' --out evaluation-output/result.json --timeout 60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-evidence
          path: evaluation-output/
