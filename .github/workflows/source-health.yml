name: Documentation source health
on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/source_health.py
      - uses: actions/upload-artifact@v4
        with:
          name: source-health
          path: source-health.json
