name: Pages deploy and checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm test
      - run: python3 -m unittest discover -s tests -p test_sampling.py -v
      - run: node --check app.js && node --check technology.js
      - name: Browser QA
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python tests/ui_test.py
      - name: Stage public static application only
        run: |
          mkdir -p public-site
          cp index.html app.js core.js technology.js benchmarks.js styles.css public-site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-site
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
