name: Pages deploy and checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: node --check app.js && node --check technology.js
      - name: Browser QA
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python tests/ui_test.py
          python tests/local_ui_test.py
          python tests/judge_ui_test.py
          python tests/recommendation_ui_test.py
          python tests/setup_handoff_test.py
          python tests/benchmark_ui_test.py
      - name: Stage public static application only
        run: python3 scripts/stage_site.py --out public-site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-site
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v5
